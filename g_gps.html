<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KLAP DEGI ULTIMATE V2 - INT GPS</title>
      <link rel="manifest" href="/manifest.json"> 
    <style>
        :root { --hrc-red: #E4002B; --hrc-white: #ffffff; --bg-dark: #000000; --hrc-orange: #FFA500; --hrc-blue: #004098; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-dark); color: var(--hrc-white); font-family: 'Arial Black', sans-serif; overflow: hidden; position: fixed; }
        #dashboard { position: relative; display: flex; flex-direction: column; height: 100dvh; width: 100vw; padding-top: env(safe-area-inset-top); }
        #canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: calc(100% - 60px) !important; z-index: 1; }

        /* UI Layout from V10.6.1 */
        .main-ui-container { position: absolute; right: 10px; top: 120px; bottom: 70px; display: flex; align-items: flex-start; gap: 45px; z-index: 20; pointer-events: auto; }
        #info-overlay { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 10px; pointer-events: none; }
        #rpm_val { font-size: 13vh; font-weight: 900; line-height: 0.8; margin-top: 10px; text-shadow: 3px 3px 12px #000; }
        #display1 { font-size: 18vh; font-weight: 900; line-height: 0.9; color: var(--hrc-white); text-shadow: 4px 4px 15px #000; }
        
        #sector-container { display: flex; justify-content: flex-end; gap: 15px; font-size: 3vh; font-weight: 900; height: 3.5vh; }
        .sec-box { display: none; text-shadow: 2px 2px 10px #000; color: #fff; }

        .right-panels { display: flex; flex-direction: row; gap: 15px; height: 100%; align-items: flex-start; }
        #lap-panel { width: 175px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        #lap { flex: 1; overflow-y: auto; scrollbar-width: none; }
        #lap::-webkit-scrollbar { display: none; }
        .lap-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 18px; font-weight: 900; }
        .best-lap { color: var(--hrc-red) !important; } 

        .data-panel { display: flex; flex-direction: column; gap: 15px; width: 110px; }
        .val { font-size: 40px; font-weight: 900; line-height: 0.9; text-shadow: 2px 2px 8px #000; }
        .label { font-size: 11px; color: var(--hrc-red); font-weight: bold; }

        footer { height: 55px; display: flex; gap: 2px; padding: 4px; background: #000; border-top: 1px solid #333; z-index: 100; position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom); }
        button { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 9px; font-weight: bold; min-width: 0; cursor: pointer; }
        button.active { background: var(--hrc-red) !important; }

        /* History Page from V10.6.1 */
        #history-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        #history-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 20px; }
        #history-table th { color: var(--hrc-red); border-bottom: 2px solid var(--hrc-red); padding: 8px; text-align: center; }
        #history-table td { padding: 8px; border-bottom: 1px solid #333; text-align: center; }
        .close-btn { background: var(--hrc-red); padding: 15px; text-align: center; font-weight: bold; border-radius: 4px; cursor: pointer; }
       /* iPhone 8 (375px) 以下：右端ゼロ距離・右揃え強制 */
@media screen and (max-width: 375px) {
    /* 1. コンテナを右端 0 に固定 */
    .main-ui-container {
        right: 0px !important; 
        padding-right: 0px !important;
        justify-content: flex-end !important;
    }

    /* 2. SPEEDパネルの「箱」を右寄せにする */
    .data-panel {
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-end !important; /* ★これが右揃えの決め手 */
        width: 80px !important; 
        margin-right: 0px !important;
    }

    /* 3. SPEEDラベルと数値を個別に右寄せ */
    .data-box {
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-end !important; /* ★中身を右に寄せる */
        width: 100% !important;
    }

    /* 4. 数字と文字を右端の1ピクセルまで寄せる */
    .val, .label {
        text-align: right !important; /* 文字の向きを右へ */
        width: 100% !important;
        display: block !important;
        padding-right: 5px !important; /* 画面端に少しだけ余白(5px)を作る */
    }

    /* 5. 左側のラップタイム(display1)を縮小して画面内に戻す */
    #display1 {
        font-size: 10vh !important;
        text-align: right !important;
    }
}
    </style>
</head>
<body>

<div id="dashboard">
    <canvas id="canvas"></canvas>
    <div class="main-ui-container">
        <div id="info-overlay">
            <div id="rpm_val">0</div>
            <div id="display1">00:00.000</div>
            <div id="sector-container">
                <div id="s1_box" class="sec-box">S1: <span id="s1_val">--.---</span></div>
                <div id="s2_box" class="sec-box">S2: <span id="s2_val">--.---</span></div>
                <div id="s3_box" class="sec-box">S3: <span id="s3_val">--.---</span></div>
            </div>
            <div id="display" style="font-size: 2.5vh; opacity: 0.8;">TOTAL 00:00.000</div>
        </div>
        <div class="right-panels">
            <div id="lap-panel"><div id="lap"></div></div>
            <div class="data-panel">
                <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
                <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color: var(--hrc-orange);">0</div></div>
                <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
            </div>
        </div>
    </div>
    <footer>
        <button id="intGpsBtn">INT GPS</button>
        <button id="btConnect">BLE START</button>
        <button id="startBtn">TIMER</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="historyBtn">HISTORY</button>
        <button id="gpxBtn" style="display:none; background:var(--hrc-orange); color:#000;">GPX SAVE</button>
        <button id="reloadBtn" onclick="location.reload()">RELOAD</button>
    </footer>
</div>

<div id="history-page">
    <div class="close-btn" onclick="document.getElementById('history-page').style.display='none'">CLOSE HISTORY</div>
    <table id="history-table">
        <thead><tr><th>LAP</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>TIME</th><th>MAX SPD</th><th>MAX RPM</th></tr></thead>
        <tbody id="history-body"></tbody>
    </table>
</div>

<script>
'use strict';
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b", PULSE_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [], gpsPoints = [];
let currentRPM = 0, currentTemp = 0, lastPos = null;
let lines = { startLine: null, s1Line: null, s2Line: null, s3Line: null };
let currentSpeedKmh = 0, maxSpeedInLap = 0, maxRpmInLap = 0;
let isFrozen = false, freezeDisplayTime = "", freezeUntil = 0;
let pulsePerRev = 1, cooldownMs = 15000, validDirection = null;
let s1_abs = 0, s2_abs = 0, s3_abs = 0, lastPassedSectorTime = 0;
let sectorDirections = { s1: null, s2: null, s3: null };
let watchId = null, wakeLock = null;

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

// --- 1. 初期化ロジック ---
function initLines() {
    ['startLine', 's1Line', 's2Line', 's3Line'].forEach(key => {
        const lat = localStorage.getItem(key + 'P1Lat');
        if (lat) {
            lines[key] = {
                p1: { lat: parseFloat(localStorage.getItem(key + 'P1Lat')), lon: parseFloat(localStorage.getItem(key + 'P1Lon')) },
                p2: { lat: parseFloat(localStorage.getItem(key + 'P2Lat')), lon: parseFloat(localStorage.getItem(key + 'P2Lon')) }
            };
            const boxId = key.replace('Line', '') + '_box';
            if (document.getElementById(boxId)) document.getElementById(boxId).style.display = 'block';
        }
    });
    pulsePerRev = parseFloat(localStorage.getItem('pl1')) || 1;
    cooldownMs = parseInt(localStorage.getItem('lapCoolDownTime')) || 15000;
}

// --- 2. 判定ロジック (V10.6.1 準拠) ---
function getIntersection(p1, p2, line) {
    if (!line) return null;
    const x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;
    const x3 = line.p1.lon, y3 = line.p1.lat, x4 = line.p2.lon, y4 = line.p2.lat;
    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null;
    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den;
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den;
    if (t >= 0 && t <= 1 && u >= -0.2 && u <= 1.2) {
        const Lx = x4 - x3, Ly = y4 - y3, Vx = x2 - x1, Vy = y2 - y1;
        const crossProduct = (Lx * Vy) - (Ly * Vx);
        return { time: p1.time + (p2.time - p1.time) * t, dir: crossProduct > 0 ? 1 : -1 };
    }
    return null;
}

// --- 3. 内部GPS処理 (USBパースをnavigator.geolocationに置換) ---
async function toggleInternalGps() {
    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        document.getElementById('intGpsBtn').classList.remove('active');
        if (wakeLock) { await wakeLock.release(); wakeLock = null; }
        return;
    }
    if ("wakeLock" in navigator) { try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e){} }
    
    document.getElementById('intGpsBtn').classList.add('active');
    watchId = navigator.geolocation.watchPosition(pos => {
        currentSpeedKmh = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
        if (swState === 1 && currentSpeedKmh > maxSpeedInLap) maxSpeedInLap = Math.round(currentSpeedKmh);
        
        const cur = { 
            lat: pos.coords.latitude, lon: pos.coords.longitude, 
            rpm: currentRPM || 0, speed: currentSpeedKmh || 0, time: Date.now() 
        };

        if (swState === 1 && lastPos) {
            gpsPoints.push(cur);
            // スタートライン判定
            const hitSL = getIntersection(lastPos, cur, lines.startLine);
            if (hitSL) {
                if (validDirection === null) validDirection = hitSL.dir;
                if (hitSL.dir === validDirection && (hitSL.time - (lapStartTime || startTime) > cooldownMs)) {
                    processLap(hitSL.time, true); // 自動判定時はフリーズあり
                }
            }
            // セクター判定
            if (lapStartTime > 0) {
                ['s1', 's2', 's3'].forEach(s => {
                    const hit = getIntersection(lastPos, cur, lines[s + 'Line']);
                    if (hit) {
                        if (sectorDirections[s] === null) sectorDirections[s] = hit.dir;
                        if (hit.dir === sectorDirections[s]) {
                            const absTime = (hit.time - lapStartTime) / 1000;
                            if (s === 's1' && s1_abs === 0) {
                                s1_abs = absTime; lastPassedSectorTime = absTime;
                                document.getElementById('s1_val').textContent = s1_abs.toFixed(3);
                            } else if (s === 's2' && s2_abs === 0) {
                                s2_abs = absTime; lastPassedSectorTime = absTime;
                                document.getElementById('s2_val').textContent = (s1_abs > 0 ? (s2_abs - s1_abs) : s2_abs).toFixed(3);
                            } else if (s === 's3' && s3_abs === 0) {
                                s3_abs = absTime; lastPassedSectorTime = absTime;
                                document.getElementById('s3_val').textContent = (s2_abs > 0 ? (s3_abs - s2_abs) : s3_abs).toFixed(3);
                            }
                        }
                    }
                });
            }
        }
        lastPos = cur;
    }, e => alert(e.message), { enableHighAccuracy: true, maximumAge: 0 });
}

// --- 4. ラップ確定処理 (V10.6.1 ロジック) ---
function processLap(hitTime, useFreeze) {
    const lapTimeMs = hitTime - (lapStartTime || startTime);
    const lapTimeSec = lapTimeMs / 1000;
    let s4 = lastPassedSectorTime > 0 ? (lapTimeSec - lastPassedSectorTime).toFixed(3) : "--.---";

    const lapData = { 
        no: lapRecords.length + 1, time: lapTimeMs, 
        max: Math.round(maxSpeedInLap), maxRpm: Math.round(maxRpmInLap),
        s1: document.getElementById('s1_val').textContent,
        s2: document.getElementById('s2_val').textContent,
        s3: document.getElementById('s3_val').textContent,
        s4: s4
    };
    
    lapRecords.unshift(lapData);
    updateLapList();

    if (useFreeze) {
        isFrozen = true; freezeDisplayTime = timeFormat(lapTimeMs); freezeUntil = Date.now() + 15000; 
    }
    
    lapStartTime = hitTime; maxSpeedInLap = 0; maxRpmInLap = 0;
    s1_abs = 0; s2_abs = 0; s3_abs = 0; lastPassedSectorTime = 0;
    
    setTimeout(() => { 
        if(swState === 1) ['s1_val','s2_val','s3_val'].forEach(id => document.getElementById(id).textContent = "--.---");
    }, 3000);
}

function updateLapList() {
    if (lapRecords.length === 0) return;
    const best = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('lap').innerHTML = lapRecords.map(r => `
        <div class="lap-row ${r.time === best && lapRecords.length > 1 ? 'best-lap' : ''}">
            <span>L${r.no}</span><span>${timeFormat(r.time)}</span>
        </div>`).join('');
}

// --- 5. HISTORY & GPX (V10.6.1 完全移植) ---
document.getElementById('historyBtn').onclick = function() {
    if (lapRecords.length === 0) return;
    const bT = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('history-body').innerHTML = lapRecords.map(r => `
        <tr style="${r.time === bT ? 'background:rgba(228,0,43,0.15);' : ''}">
            <td>${r.no}</td><td>${r.s1}</td><td>${r.s2}</td><td>${r.s3}</td><td>${r.s4}</td>
            <td style="${r.time===bT?'color:var(--hrc-red);':''}">${timeFormat(r.time)}</td>
            <td>${r.max}</td><td>${r.maxRpm}</td>
        </tr>`).join('');
    document.getElementById('history-page').style.display = 'block';
};

document.getElementById('gpxBtn').onclick = () => {
    if (gpsPoints.length === 0) return;
    const getL = (k) => {
        const p1 = localStorage.getItem(k + 'P1Lat');
        return p1 ? `${p1},${localStorage.getItem(k + 'P1Lon')},${localStorage.getItem(k + 'P2Lat')},${localStorage.getItem(k + 'P2Lon')}` : "";
    };
    const lineData = `SL:${getL('startLine')}|S1:${getL('s1Line')}|S2:${getL('s2Line')}|S3:${getL('s3Line')}`;
    let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="KLAP_DEGI" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1"><metadata><desc>LINE_DATA[${lineData}]</desc></metadata><trk><trkseg>`;
    const base = gpsPoints[0].time;
    gpsPoints.forEach(p => {
        const relTime = new Date(946684800000 + (p.time - base)).toISOString();
        gpx += `<trkpt lat="${p.lat}" lon="${p.lon}"><time>${relTime}</time><speed>${(p.speed/3.6).toFixed(2)}</speed><extensions><gpxtpx:TrackPointExtension><gpxtpx:hr>${Math.round(p.rpm)}</gpxtpx:hr></gpxtpx:TrackPointExtension></extensions></trkpt>`;
    });
    gpx += `</trkseg></trk></gpx>`;
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `RaceLog_${Date.now()}.gpx`; a.click();
};

// --- 6. UI & メインループ ---
function mainLoop() {
    const now = Date.now();
    if (swState === 1) {
        if (currentRPM > maxRpmInLap) maxRpmInLap = Math.round(currentRPM);
        document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
        document.getElementById('display1').textContent = (isFrozen && now < freezeUntil) ? freezeDisplayTime : timeFormat(now - (lapStartTime || startTime));
    }
    drawTacho(currentRPM);
    requestAnimationFrame(mainLoop);
}

function drawTacho(rpm) {
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    // キャンバスサイズの更新（リサイズ対応）
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
    }

    ctx.clearRect(0, 0, w, h);

    // --- 1. レイアウト設定（レスポンシブR計算） ---
    // iPhone 8 (375px) は R=85 固定、AQUOS (412px〜) は最大150まで拡大
    let rad = 85; 
    if (w > 375) {
        rad = Math.min(150, 85 + (w - 375) * 1.8);
    }

    const sideMargin = 45;   
    const topMargin = 60;    
    const footerHeight = h * 0.85; 
    const barWeight = 48;   
    const rLimit = w;        
    const vLimit = topMargin + rad; 

    const vLen = footerHeight - vLimit; 
    const cLen = (Math.PI * rad) / 2;                 
    const hLen = rLimit - (sideMargin + rad); 
    const totalLen = vLen + cLen + hLen;
    const activeLen = (rpm / 14000) * totalLen;

    // パス定義（描画専用）
    function createPath(c) {
        c.beginPath();
        c.lineCap = "butt";
        c.lineJoin = "round";
        c.moveTo(sideMargin, footerHeight);
        c.lineTo(sideMargin, vLimit);
        c.arc(sideMargin + rad, vLimit, rad, Math.PI, Math.PI * 1.5);
        c.lineTo(rLimit, topMargin);
    }

    // --- 2. ベース描画（グレー） ---
    ctx.save();
    createPath(ctx);
    ctx.strokeStyle = "#222222";
    ctx.lineWidth = barWeight;
    ctx.stroke();
    ctx.restore();

    // --- 3. カラーバー描画（白・青・赤の順） ---
    // 現在の回転数(activeLen)までを白で引く
    ctx.save();
    createPath(ctx);
    ctx.lineWidth = barWeight;
    ctx.setLineDash([activeLen, totalLen]);
    ctx.strokeStyle = "#FFFFFF";
    ctx.stroke();
    ctx.restore();

    // 6000rpm以上の青
    const blueStart = totalLen * (6000 / 14000);
    if (activeLen > blueStart) {
        ctx.save();
        createPath(ctx);
        ctx.lineWidth = barWeight + 1;
        ctx.setLineDash([activeLen - blueStart, totalLen]);
        ctx.lineDashOffset = -blueStart;
        ctx.strokeStyle = "#0055FF";
        ctx.stroke();
        ctx.restore();
    }

    // 11000rpm以上の赤
    const redStart = totalLen * (11000 / 14000);
    if (activeLen > redStart) {
        ctx.save();
        createPath(ctx);
        ctx.lineWidth = barWeight + 2;
        ctx.setLineDash([activeLen - redStart, totalLen]);
        ctx.lineDashOffset = -redStart;
        ctx.strokeStyle = "#FF0000";
        ctx.stroke();
        ctx.restore();
    }

    // --- 4. 250rpm刻みの高精度セグメント（黒スリット） ---
    ctx.save();
    createPath(ctx);
    ctx.lineWidth = barWeight + 10;
    ctx.strokeStyle = "#000000"; 
    
    // 250rpm目盛り (56分割)
    const sWidth = 1.8; 
    const sGap = (totalLen / 56) - sWidth;
    ctx.setLineDash([sWidth, sGap]);
    ctx.lineDashOffset = sWidth / 2;
    ctx.stroke();

    // 1000rpm目盛り (14分割、少し太く)
    const mWidth = 4;
    const mGap = (totalLen / 14) - mWidth;
    ctx.setLineDash([mWidth, mGap]);
    ctx.lineDashOffset = mWidth / 2;
    ctx.stroke();
    ctx.restore();

    // --- 5. 数値（ラベル） ---
    ctx.font = "italic 900 24px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#666"; 
    const offset = 48 + (rad - 85) * 0.15; 

    for (let i = 0; i <= 14; i++) {
        const prog = i / 14;
        let lx, ly;
        if (prog < 0.1) {
            lx = sideMargin - offset;
            ly = footerHeight - (prog / 0.1) * vLen;
        } else if (prog < 0.35) {
            const p = (prog - 0.1) / 0.25;
            const theta = Math.PI + (p * Math.PI / 2);
            lx = sideMargin + rad + Math.cos(theta) * (rad + offset);
            ly = vLimit + Math.sin(theta) * (rad + offset);
        } else {
            const p = (prog - 0.35) / 0.65;
            lx = (sideMargin + rad) + p * (w - 20 - (sideMargin + rad));
            ly = topMargin - offset;
        }
        ctx.fillText(i, Math.max(15, Math.min(w - 15, lx)), ly);
    }

    // --- 6. 数値表示の更新（元コードのロジック） ---
    document.getElementById('rpm_val').textContent = Math.floor(rpm);
    document.getElementById('speed_val').textContent = Math.round(currentSpeedKmh);
    document.getElementById('max_speed_val').textContent = maxSpeedInLap;
}

document.getElementById('intGpsBtn').onclick = toggleInternalGps;
document.getElementById('startBtn').onclick = function() {
    if (swState !== 1) {
        swState = 1; startTime = Date.now(); lapStartTime = 0; lapRecords = []; gpsPoints = [];
        validDirection = null; this.classList.add('active');
        document.getElementById('gpxBtn').style.display = 'none';
    } else {
        swState = 2; this.classList.remove('active');
        document.getElementById('gpxBtn').style.display = 'block';
    }
};
document.getElementById('lapBtn').onclick = () => {
    if (swState === 1) processLap(Date.now(), false); // 手動時はフリーズなし
    else if (confirm("RESET?")) location.reload();
};
document.getElementById('btConnect').onclick = async function() {
    try {
        const ble = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
        const server = await ble.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const pC = await service.getCharacteristic(PULSE_UUID);
        await pC.startNotifications(); this.classList.add('active');
        pC.oncharacteristicvaluechanged = (e) => {
            const data = e.target.value; currentRPM = (data.getUint16(0, true) * 60) / pulsePerRev;
            currentTemp = data.getUint8(2); document.getElementById('temp_val').textContent = currentTemp;
        };
    } catch (e) { this.classList.remove('active'); }
};

function timeFormat(ms){ if(ms<0) ms=0; const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), ms2=Math.floor(ms%1000); return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${ms2.toString().padStart(3,'0')}`; }

window.onload = () => {
    canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
    initLines(); mainLoop();
};
</script>
